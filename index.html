<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Who's First - Admin</title>
<style>
:root {
  --bg: #0f0d1e;
  --card: #221e42;
  --yellow: #ffd23f;
  --yellow-dark: #e6b800;
  --text: #f5f5f7;
  --muted: #9b9bb8;
  --danger: #ff5e5e;
  --success: #34d399;
  --border: rgba(255, 210, 63, 0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  background-image: radial-gradient(circle at 20% 80%, rgba(255, 210, 63, 0.05) 0%, transparent 50%);
  color: var(--text);
  min-height: 100vh;
}
.container { max-width: 520px; margin: 0 auto; padding: 20px 16px; }
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px;
  margin: 16px 0;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  animation: fadeInUp 0.5s ease-out;
}
h1 {
  text-align: center;
  font-size: 32px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--yellow), #fff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 20px 0 8px;
}
h2 { color: var(--yellow); margin-bottom: 14px; font-size: 20px; }
input, button, textarea {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  transition: all 0.2s;
}
input, textarea {
  background: rgba(42, 38, 80, 0.8);
  color: white;
  border: 1px solid transparent;
}
input:focus {
  outline: none;
  border-color: var(--yellow);
  box-shadow: 0 0 0 3px rgba(255, 210, 63, 0.15);
}
button {
  background: linear-gradient(135deg, var(--yellow), var(--yellow-dark));
  color: #171433;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(255, 210, 63, 0.25);
}
button:hover { transform: translateY(-1px); }
.hidden { display: none !important; }
.error { color: var(--danger); text-align: center; }
.success { color: var(--success); }
.user-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
  background: rgba(42, 38, 80, 0.6);
  margin: 8px 0;
  border-radius: 12px;
  animation: fadeInUp 0.4s ease-out;
}
.user-item button {
  width: auto;
  padding: 6px 12px;
  margin: 0 3px;
  font-size: 13px;
  border-radius: 8px;
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
  <div id="loginScreen">
    <h1>Admin</h1>
    <p style="text-align:center; color:var(--muted); margin-bottom:20px;">Who's First Control Panel</p>
    <div class="card">
      <input id="password" type="password" placeholder="Password">
      <button onclick="login()">Login</button>
      <div id="loginError" class="error"></div>
      <div id="debugInfo" style="font-size:12px; color:#888; margin-top:8px; text-align:center;"></div>
    </div>
  </div>

  <div id="adminApp" class="hidden">
    <h1>Admin Panel</h1>
    <p style="text-align:center; color:var(--muted); margin-bottom:10px;">Logged in: <span id="adminName" style="color:var(--yellow);font-weight:700;"></span></p>
    <button onclick="logout()" style="background:linear-gradient(135deg,#ff5e5e,#e53e3e); margin-bottom:10px;">Logout</button>

    <div class="card">
      <h2>OpenRouter API Key</h2>
      <input id="apiKeyInput" placeholder="sk-or-v1-... paste karo">
      <button onclick="saveApiKey()">Save Key</button>
      <div id="keyStatus" style="margin-top:8px; font-size:14px;"></div>
    </div>

    <div class="card">
      <h2>Naya Quiz Banao</h2>
      <input id="quizTitle" placeholder="Quiz Title">
      <input id="quizN" type="number" placeholder="Number of questions" value="10">
      <input id="startTime" type="datetime-local">
      <input type="file" id="photoUpload" accept="image/*" multiple style="padding:12px; background:rgba(42,38,80,0.5);">
      <button onclick="generateQuestions()">Photos se Questions Generate Karo</button>
      <div id="genStatus" style="margin-top:10px;"></div>
      <button onclick="publishQuiz()" style="margin-top:8px;">Quiz Publish / Start Time Set</button>
    </div>

    <div class="card">
      <h2>Users Manage</h2>
      <div id="usersList"></div>
    </div>

    <div class="card">
      <h2>Scores</h2>
      <button onclick="publishScores()">Publish Scores</button>
      <div id="scoreStatus" style="margin-top:10px;"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBf1P8CAnOO82mZ732Y__Qc5GhZPtbmuoU",
  authDomain: "who-s-first-413b6.firebaseapp.com",
  projectId: "who-s-first-413b6",
  storageBucket: "who-s-first-413b6.firebasestorage.app",
  messagingSenderId: "127926503365",
  appId: "1:127926503365:web:daf066f2f3a9b032602dac"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentAdmin = '';
let generatedQuestions = null;
let currentQuizId = null;
let apiKey = '';

const ADMIN_ACCOUNTS = [
  { user: 'AARYAN7X0', pass: 'A1BOKY', email: 'a_aaryan7x0@whosfirst.app' },
  { user: 'AYANT41', pass: 'AB42XJ', email: 'a_ayant41@whosfirst.app' }
];

function showDebug(msg) {
  const el = document.getElementById('debugInfo');
  if (el) el.textContent = msg;
}

if (window.location.protocol === 'file:') {
  showDebug('⚠️ Local file se Firebase kaam nahi karega. Vercel pe host karo.');
}

async function login() {
  const password = document.getElementById('password').value.trim();
  if (!password) {
    document.getElementById('loginError').textContent = 'Password daalo';
    return;
  }
  document.getElementById('loginError').textContent = 'Checking...';
  showDebug('Trying...');

  if (typeof firebase === 'undefined') {
    document.getElementById('loginError').textContent = 'Firebase load nahi hua';
    return;
  }

  let lastError = '';
  let matched = false;

  for (const acc of ADMIN_ACCOUNTS) {
    if (acc.pass.toLowerCase() === password.toLowerCase()) {
      matched = true;
      try {
        showDebug('Trying ' + acc.email);
        await auth.signInWithEmailAndPassword(acc.email, acc.pass);
        document.getElementById('loginError').textContent = '';
        return;
      } catch (e) {
        lastError = e.code || e.message || 'error';
        showDebug('Error: ' + lastError);
      }
    }
  }

  if (!matched) {
    document.getElementById('loginError').textContent = 'Galat password';
  } else {
    document.getElementById('loginError').textContent = 'Login failed: ' + lastError;
  }
}

auth.onAuthStateChanged(user => {
  if (user) {
    currentAdmin = user.email.split('@')[0].replace('a_', '').toUpperCase();
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('adminApp').classList.remove('hidden');
    document.getElementById('adminName').textContent = currentAdmin;
    loadApiKey();
    loadUsers();
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('adminApp').classList.add('hidden');
  }
});

function logout() { auth.signOut(); }

async function loadApiKey() {
  try {
    const snap = await db.collection('cfg').doc('ai').get();
    if (snap.exists) {
      apiKey = snap.data().k || '';
      document.getElementById('keyStatus').textContent = apiKey ? '✅ Key saved hai' : 'Key nahi hai';
    }
  } catch(e) {}
}

async function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) return;
  try {
    await db.collection('cfg').doc('ai').set({ k: key });
    apiKey = key;
    document.getElementById('keyStatus').textContent = '✅ Key save ho gayi';
    document.getElementById('apiKeyInput').value = '';
  } catch(e) {
    document.getElementById('keyStatus').textContent = 'Error: ' + e.message;
  }
}

function resizeImage(file, maxW = 800) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.7).split(',')[1]);
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });
}

async function generateQuestions() {
  if (!apiKey) return document.getElementById('genStatus').textContent = 'Pehle API key save karo';
  const files = document.getElementById('photoUpload').files;
  if (files.length === 0) return document.getElementById('genStatus').textContent = 'Photos select karo';
  document.getElementById('genStatus').textContent = '⏳ Generating...';

  try {
    const images = [];
    for (let f of Array.from(files).slice(0, 3)) {
      images.push(await resizeImage(f));
    }

    const content = [
      { type: "text", text: "Generate multiple choice quiz questions from these book/page images. Return ONLY valid JSON array of objects: [{q: 'question text', o: ['opt1','opt2','opt3','opt4'], a: 0}]. a is correct index 0-3. Make 5-15 questions. No extra text." }
    ];
    images.forEach(b64 => {
      content.push({ type: "image_url", image_url: { url: "data:image/jpeg;base64," + b64 } });
    });

    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + apiKey,
        "Content-Type": "application/json",
        "HTTP-Referer": window.location.origin,
        "X-Title": "WhosFirst"
      },
      body: JSON.stringify({
        model: "google/gemini-2.5-flash",
        messages: [{ role: "user", content }]
      })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'API error');
    let text = data.choices[0].message.content;
    const match = text.match(/\[[\s\S]*\]/);
    if (!match) throw new Error('No JSON found');
    generatedQuestions = JSON.parse(match[0]);
    document.getElementById('genStatus').innerHTML = `<span class="success">✅ ${generatedQuestions.length} questions generate ho gaye. Ab Publish karo.</span>`;
  } catch(e) {
    document.getElementById('genStatus').textContent = '❌ Error: ' + e.message;
  }
}

async function publishQuiz() {
  if (!generatedQuestions) return alert('Pehle questions generate karo');
  const title = document.getElementById('quizTitle').value.trim() || 'Quiz';
  const n = parseInt(document.getElementById('quizN').value) || generatedQuestions.length;
  const startInput = document.getElementById('startTime').value;
  const startAt = startInput ? new Date(startInput) : new Date(Date.now() + 60000);

  currentQuizId = 'q_' + Date.now();
  try {
    await db.collection('qs').doc(currentQuizId).set({
      items: generatedQuestions.map(q => ({ q: q.q, o: q.o }))
    });
    await db.collection('keys').doc(currentQuizId).set({
      a: generatedQuestions.map(q => q.a)
    });
    await db.collection('quiz').doc('cur').set({
      id: currentQuizId,
      title,
      n,
      startAt: firebase.firestore.Timestamp.fromDate(startAt)
    });
    document.getElementById('genStatus').innerHTML = `<span class="success">✅ Quiz publish ho gaya! ID: ${currentQuizId}</span>`;
  } catch(e) {
    alert('Publish error: ' + e.message);
  }
}

async function loadUsers() {
  try {
    const snap = await db.collection('users').get();
    const el = document.getElementById('usersList');
    el.innerHTML = '';
    snap.forEach(doc => {
      const u = doc.data();
      const div = document.createElement('div');
      div.className = 'user-item';
      div.innerHTML = `
        <span>${doc.id} <small style="color:var(--muted)">(${u.status || 'active'})</small></span>
        <div>
          <button onclick="blockUser('${doc.id}')">Block</button>
          <button onclick="removeUser('${doc.id}')" style="background:#ff5e5e;">Remove</button>
          <button onclick="restoreUser('${doc.id}')" style="background:#34d399;">Restore</button>
        </div>
      `;
      el.appendChild(div);
    });
  } catch(e) {
    document.getElementById('usersList').innerHTML = '<p class="error">Users load error</p>';
  }
}

async function blockUser(id) {
  if (id.startsWith('a_')) return alert('Admin ko block nahi kar sakte');
  await db.collection('users').doc(id).update({ status: 'blocked', until: firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 86400000)) });
  loadUsers();
}
async function removeUser(id) {
  if (id.startsWith('a_')) return alert('Admin ko remove nahi kar sakte');
  await db.collection('users').doc(id).update({ status: 'removed' });
  loadUsers();
}
async function restoreUser(id) {
  await db.collection('users').doc(id).update({ status: 'active', until: null });
  loadUsers();
}

async function publishScores() {
  if (!currentQuizId) {
    const cur = await db.collection('quiz').doc('cur').get();
    if (!cur.exists) return alert('Koi quiz nahi');
    currentQuizId = cur.data().id;
  }
  document.getElementById('scoreStatus').textContent = '⏳ Calculating...';
  try {
    const keysSnap = await db.collection('keys').doc(currentQuizId).get();
    if (!keysSnap.exists) return alert('Keys nahi mili');
    const correct = keysSnap.data().a || [];

    const ansSnap = await db.collection('ans').where('q', '==', currentQuizId).get();
    const batch = db.batch();
    let count = 0;
    ansSnap.forEach(doc => {
      const data = doc.data();
      let score = 0;
      (data.a || []).forEach((ans, i) => {
        if (ans === correct[i]) score++;
      });
      const scoreRef = db.collection('scores').doc(currentQuizId + '_' + data.u.toLowerCase());
      batch.set(scoreRef, {
        id: currentQuizId,
        u: data.u,
        title: 'Quiz',
        n: correct.length,
        s: score,
        t: firebase.firestore.FieldValue.serverTimestamp()
      });
      count++;
    });
    await batch.commit();
    document.getElementById('scoreStatus').textContent = '✅ ' + count + ' players ke scores publish ho gaye';
  } catch(e) {
    document.getElementById('scoreStatus').textContent = 'Error: ' + e.message;
  }
}
</script>
</body>
</html>
